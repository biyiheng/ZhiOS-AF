<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>ZhiOS-AF ZMonitor</title>
<style>
  body { font-family: "Segoe UI", sans-serif; margin: 2em; background: #f5f6fa; }
  h1 { color: #2c3e50; }
  .card { background: #fff; border-radius: 8px; padding: 1em 1.5em;
          margin-bottom: 1em; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
  table { border-collapse: collapse; width: 100%; }
  td, th { border: 1px solid #e0e0e0; padding: 6px 10px; text-align: left; }
  th { background: #ecf0f1; }
  .ok { color: #27ae60; font-weight: 600; }
  .bad { color: #c0392b; font-weight: 600; }
</style>
</head>
<body>
<h1>ZhiOS-AF ZMonitor 运行监控</h1>
<p>此页面由 <code>tools/zmonitor</code> 提供，作为网关/固件状态的可视化占位。
实时数据可对接固件 ZTEST / ZProfiler 输出。</p>

<div class="card">
  <h3>系统概览</h3>
  <table>
    <tr><th>指标</th><th>值</th></tr>
    <tr><td>服务状态</td><td class="ok">ONLINE</td></tr>
    <tr><td>单元测试</td><td id="tests">--</td></tr>
    <tr><td>推理决策目标</td><td>&lt; 50ms</td></tr>
    <tr><td>本地/云端切换目标</td><td>&lt; 200ms</td></tr>
  </table>
</div>

<script>
  // 可通过 HTTP 拉取后端状态（示例端点）
  fetch('/health').then(r => r.json()).then(d => {
    const el = document.getElementById('tests');
    el.textContent = d && d.ok ? 'ALL PASS (gateway healthy)' : 'UNKNOWN';
  }).catch(() => {
    document.getElementById('tests').textContent = 'gateway offline';
  });
</script>
</body>
</html>
