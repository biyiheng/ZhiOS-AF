name: CI

on:
  push:
    branches: [ main, release ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    name: Build + Unit Test + Simulation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y make gcc cmake cppcheck

      - name: Host build (Makefile)
        run: make

      - name: Host unit tests (ZTEST)
        run: make test

      - name: "Static analysis (cppcheck, D2: MISRA/CERT-C baseline)"
        run: |
          cppcheck --enable=warning,style,performance,portability --std=c99 \
            --error-exitcode=0 --suppress=missingIncludeSystem \
            --inline-suppr -I include -I hal -I kernel -I ai_kernel \
            hal hal_host.c kernel kernel.c ai_kernel model_runtime agent ai_service 2>&1 || true
          echo "(启用 cppcheck-misra/cert addons 可在 CI 中进一步强化 D2 门槛)"

      - name: Python logic simulation
        run: python3 tools/sim/zhio_sim.py

      - name: Agent console E2E (in-process)
        run: python3 tools/agent_console/e2e_test.py

      - name: Release deployability self-check
        run: python3 tools/verify_release.py

  arm-verify:
    name: ARM-EABI Link Verify + QEMU Jitter Stress
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install arm-none-eabi + QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi qemu-system-arm
          arm-none-eabi-gcc --version
          qemu-system-arm --version

      - name: Link verify startup/context-switch assembly (M7 + M3)
        run: bash tools/arm_eabi/build_verify.sh

      - name: QEMU context-switch jitter smoke test
        # QEMU 冒烟阈值：mps2-an385 主频 25MHz，真实 M3 上下文切换约 40~80 周期
        # (=1.6~3.2μs)，且 TCG 仿真会引入额外时序抖动，故 <1μs/10% 属真机(480MHz)
        # 指标，此处用 10μs(=250 周期)/100% 验证"切换可用、样本可捕获、无重大退化"。
        run: python3 tools/arm_eabi/stress_sched.py --freq 25000000 --runs 10 --max-switch-ns 10000 --max-jitter-pct 100
